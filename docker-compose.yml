services:
  backend:
    build: ./back
    container_name: preytweet-backend
    env_file:
      - ./back/.env
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - elasticsearch

  socket:
    build: ./SocketConn
    container_name: preytweet-socket
    env_file:
      - ./SocketConn/.env
    ports:
      - "9000:9000"
    volumes:
      - ./SocketConn:/app
      - /app/node_modules

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: preytweet-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"